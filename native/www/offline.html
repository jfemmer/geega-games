<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Geega Admin — offline</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f3f8;
        color: #241d31;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main { max-width: 340px; }
      h1 { font-size: 1.3rem; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #5c5468; }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 12px 22px;
        background: #7c00e6;
        color: #fff;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach Geega Games</h1>
      <p>Check your Wi-Fi or cellular connection, then try again.</p>
      <button type="button" onclick="location.href='https://geega-games.com/admin_dashboard'">Try again</button>
    </main>
  </body>
</html>
