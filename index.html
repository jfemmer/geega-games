<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons (files exist in /public) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#663399" />

    <!-- Per-page SEO tags. scripts/prerender.ts replaces everything between
         these markers at build time with each page's own title, description,
         canonical, robots, Open Graph/Twitter text and JSON-LD (from the
         page's useSEO call and src/seo/site.ts). What's here is only the dev
         server's fallback — edit src/seo/, not this block. -->
    <!--seo-head-->
    <title>Geega Games | Buy & Sell Magic: The Gathering Cards — St. Louis</title>
    <meta name="description" content="Buy Magic: The Gathering singles online and sell your MTG cards or collection to Geega Games." />
    <!--/seo-head-->

    <!-- Site-wide social tags (same on every page) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Geega Games" />
    <meta property="og:image" content="https://geega-games.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://geega-games.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
