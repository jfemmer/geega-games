<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons (files exist in /public) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#663399" />

    <title>Geega Games — Buy & Sell Magic: The Gathering Singles Online</title>
    <meta
      name="description"
      content="Geega Games is an online Magic: The Gathering card shop. Browse thousands of singles, check out securely, and track your order — based near St. Louis, MO and shipping nationwide."
    />

    <!-- Canonical + robots -->
    <link rel="canonical" href="https://geega-games.com/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Geega Games" />
    <meta property="og:title" content="Geega Games — Buy & Sell Magic: The Gathering Singles Online" />
    <meta
      property="og:description"
      content="Browse thousands of Magic: The Gathering singles and check out securely — based near St. Louis, MO and shipping nationwide."
    />
    <meta property="og:url" content="https://geega-games.com/" />
    <meta property="og:image" content="https://geega-games.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Geega Games — Buy & Sell Magic: The Gathering Singles Online" />
    <meta
      name="twitter:description"
      content="Browse thousands of Magic: The Gathering singles and check out securely — shipping nationwide."
    />
    <meta name="twitter:image" content="https://geega-games.com/og-image.png" />

    <!-- Structured data: uses only verified business info. Update the URL and
         add contactPoint/address only once those details are confirmed.
         areaServed reflects the confirmed online-only (no storefront)
         service area: about a 6-hour drive of St. Louis, MO. Keep the state
         list in sync with SellCollectionPage.tsx's SERVICE_STATES if that
         region changes.

         legalName/disambiguatingDescription exist because Google's AI
         Overview has, at least once, summarized this site as "operated by
         the content creator GEEGA" — an unrelated streamer whose name is
         nearly identical to ours. disambiguatingDescription is the
         schema.org field built for exactly this (distinguishing an entity
         from other similarly-named ones); keep it if that misattribution
         recurs. See also the matching AboutPage JSON-LD in
         StaticPages.tsx's AboutPage. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "Geega Games",
        "legalName": "Geega Games LLC",
        "description": "Magic: The Gathering singles — buy, sell, and trade.",
        "disambiguatingDescription": "Geega Games is an independently owned and operated online card shop. It is not affiliated with, operated by, or endorsed by any content creator, streamer, or influencer, including anyone using the name \"Geega\" or \"GEEGA.\"",
        "url": "https://geega-games.com/",
        "logo": "https://geega-games.com/logo.png",
        "image": "https://geega-games.com/og-image.png",
        "areaServed": [
          {
            "@type": "GeoCircle",
            "geoMidpoint": { "@type": "GeoCoordinates", "latitude": 38.627, "longitude": -90.1994 },
            "geoRadius": 563000
          },
          { "@type": "City", "name": "St. Louis", "containedInPlace": { "@type": "State", "name": "Missouri" } },
          { "@type": "State", "name": "Missouri" },
          { "@type": "State", "name": "Illinois" },
          { "@type": "State", "name": "Kentucky" },
          { "@type": "State", "name": "Indiana" },
          { "@type": "State", "name": "Tennessee" },
          { "@type": "State", "name": "Arkansas" },
          { "@type": "State", "name": "Kansas" },
          { "@type": "State", "name": "Iowa" },
          { "@type": "State", "name": "Oklahoma" }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
