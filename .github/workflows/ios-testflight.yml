name: iPhone app → TestFlight

# Builds the "Geega Admin" iPhone app on a GitHub-hosted Mac and uploads it
# to TestFlight — no Mac needed on our side. See docs/IOS_APP.md for the
# one-time Apple setup and the four repository secrets this uses.
#
# The app loads the live dashboard, so ordinary website deploys don't need a
# new build. It runs when:
#   * someone clicks "Run workflow" (Actions tab),
#   * native files change on main (ios/, native/, capacitor.config.ts), or
#   * every other month, because TestFlight builds expire after 90 days.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "native/**"
      - "capacitor.config.ts"
      - ".github/workflows/ios-testflight.yml"
  schedule:
    - cron: "17 15 1 */2 *" # 15:17 UTC on the 1st of every other month

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      HAS_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 != '' }}
    steps:
      - name: Check the Apple secrets
        id: check
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::notice::Skipping the iPhone build: the Apple secrets aren't set yet (see docs/IOS_APP.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install and sync the app project
        if: steps.check.outputs.ready == 'true'
        run: |
          npm ci
          npx cap sync ios

      - name: Use the newest installed Xcode
        if: steps.check.outputs.ready == 'true'
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install the App Store Connect API key
        if: steps.check.outputs.ready == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Build (archive)
        if: steps.check.outputs.ready == 'true'
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/GeegaAdmin.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to TestFlight
        if: steps.check.outputs.ready == 'true'
        run: |
          sed "s/__TEAM_ID__/$APPLE_TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GeegaAdmin.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Build ${{ github.run_number }} uploaded. It shows up in TestFlight after Apple finishes processing (usually 5–15 minutes)."

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
